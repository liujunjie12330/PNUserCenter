<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>感谢您的支持</title>
    <style>
        table {
            width: 700px;
            margin: 0 auto;
        }
        #top {
            width: 700px;
            border-bottom: 1px solid #ccc;
            margin: 0 auto 30px;
        }
        #top table {
            font: 12px Tahoma, Arial, 宋体;
            height: 40px;
        }
        #content {
            width: 680px;
            padding: 0 10px;
            margin: 0 auto;
        }
        #content_top {
            line-height: 1.5;
            font-size: 14px;
            margin-bottom: 25px;
            color: #4d4d4d;
        }
        #content_top strong {
            display: block;
            margin-bottom: 15px;
        }
        #content_top strong span {
            color: #f60;
            font-size: 16px;
        }
        #content_bottom {
            margin-bottom: 30px;
        }
        #content_bottom small {
            display: block;
            margin-bottom: 20px;
            font-size: 12px;
            color: #747474;
        }
        #bottom {
            width: 700px;
            margin: 0 auto;
        }
        #bottom div {
            padding: 10px 10px 0;
            border-top: 1px solid #ccc;
            color: #747474;
            margin-bottom: 20px;
            line-height: 1.3em;
            font-size: 12px;
        }
        #content_top strong span {
            font-size: 18px;
            color: #FE4F70;
        }
        #sign {
            text-align: right;
            font-size: 18px;
            color: #FE4F70;
            font-weight: bold;
        }
        .read-button {
            display: inline-block;
            margin: 10px 0;
            padding: 15px 30px;
            font-size: 16px;
            color: #fff;
            background-color: #FE4F70;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
        }
        .read-button:hover {
            background-color: #e03a5f;
        }
    </style>
</head>
<body>
<table>
    <tbody>
    <tr>
        <td>
            <div id="top">
                <table>
                    <tbody><tr><td></td></tr></tbody>
                </table>
            </div>
            <div id="content">
                <div id="content_top">
                    <strong>尊敬的<span th:text="${fullname}">用户</span>，您好！</strong>
                    <strong>
                        感谢您购买文章《<span th:text="${title}">文章标题</span>》。您的支持是我们前进的动力！
                    </strong>
                    <strong>
                        如有任何问题，请联系我们的客服团队。
                    </strong>
                </div>
                <div id="content_bottom">
                    <small>
                        注意：此邮件为系统自动发送，请勿直接回复。<br>
                        如果您有任何疑问，请通过平台客服渠道联系我们。
                    </small>
                </div>
            </div>
            <div id="bottom">
                <div>
                    <p>请保管好您的账号信息，避免账号被他人盗用。</p>
                    <p id="sign">编程导航</p>
                </div>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
